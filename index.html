<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<!-- Adapt layout for mobile and different screen sizes -->
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CODETYPE — Speed Typing Game</title>
<!-- Link external CSS file for page styling -->
<link rel="stylesheet" href="style.css">
</head>
<body>
<!-- Game countdown element (hidden shows 3/2/1 before game starts) -->
<div class="countdown hidden" id="countdown"><span class="cn" id="cn-num">3</span></div>

<!-- Main page container -->
<div class="wrap">
  <!-- Header area: game logo and slogan -->
  <div class="header">
    <div class="logo">CODE<span>TYPE</span></div>
    <div class="tagline">// Level Up Your Typing Speed </div>
  </div>
  
  <!-- Screen 1: Difficulty & Category Selection Page (default active page) -->
  <div class="screen active" id="screen-select">
     <!-- Difficulty selection buttons: Easy / Medium / Hard -->
    <div class="select-label">— Difficulty —</div>
    <div class="diff-row" id="diff-row">
      <button class="diff-btn active" data-diff="easy">Easy · 60s</button>
      <button class="diff-btn" data-diff="medium">Medium · 45s</button>
      <button class="diff-btn" data-diff="hard">Hard · 30s</button>
    </div>
    <!-- Dynamic category list container (generated by JS) -->
    <div class="select-label">— Choose a category —</div>
    <div class="select-grid" id="cat-grid"></div>
  </div>

  <!-- Screen 2: Main Game Playing Page -->
  <div class="screen" id="screen-game">
    <!-- Top bar: exit button, category name and real-time stats -->
    <div class="game-top">
      <button class="btn-back" id="btn-back">← exit</button>
      <div class="game-cat" id="game-cat-label">—</div>
      <!-- Real-time game statistics: WPM, Accuracy, Score, Time -->
      <div class="stats-row">
        <div class="stat-pill"><div class="sl">WPM</div><div class="sv violet" id="hud-wpm">0</div></div>
        <div class="stat-pill"><div class="sl">Acc</div><div class="sv green" id="hud-acc">100%</div></div>
        <div class="stat-pill"><div class="sl">Score</div><div class="sv" id="hud-score">0</div></div>
        <div class="stat-pill"><div class="sl">Time</div><div class="sv" id="hud-time">—</div></div>
      </div>
    </div>
    <!-- Countdown progress bar -->
    <div class="timer-wrap"><div class="timer-fill" id="timer-fill"></div></div>
    <!-- Target word display area: progress, target word and hint -->
    <div class="word-display">
      <div class="word-progress" id="word-progress">word 1 of 20</div>
      <div class="word-target" id="word-target"></div>
      <div class="word-hint" id="word-hint"></div>
    </div>
    <!-- Text input box for typing -->
    <div class="input-row">
      <input class="type-input" id="type-input" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="start typing…">
    </div>
    <!-- Upcoming words queue -->
    <div class="queue-row" id="queue-row"></div>
    <div class="feedback-strip" id="feedback-strip"></div>
  </div>

  <!-- Screen 3: Final Result Page after game ends -->
  <div class="screen" id="screen-result">
    <div class="result-title" id="res-title">Round complete</div>
    <div class="result-sub" id="res-sub">—</div>
    <!-- Game result data display -->
    <div class="result-wrap">
      <div class="result-block"><div class="rb-label">WPM</div><div class="rb-val violet" id="res-wpm">0</div></div>
      <div class="result-block"><div class="rb-label">Accuracy</div><div class="rb-val green" id="res-acc">0%</div></div>
      <div class="result-block"><div class="rb-label">Score</div><div class="rb-val amber" id="res-score">0</div></div>
      <div class="result-block"><div class="rb-label">Words typed</div><div class="rb-val" id="res-words">0</div></div>
      <!-- WPM trend chart -->
      <div class="result-block wide">
        <div class="rb-label">WPM over time</div>
        <div class="bar-chart" id="wpm-chart"></div>
      </div>
      <!-- List of incorrect/missed words for review -->
      <div class="result-block wide" id="missed-block">
        <div class="rb-label">Words to review</div>
        <div class="missed-list" id="missed-list"></div>
      </div>
    </div>
    <!-- Operation buttons: retry / reselect category -->
    <div class="btn-row">
      <button class="game-btn primary" id="btn-retry">Try again</button>
      <button class="game-btn" id="btn-cats">Change category</button>
    </div>
  </div>
</div>

<!-- Link external JavaScript file for game logic and interactions -->
<script src="script.js"></script>
</body>
</html>
